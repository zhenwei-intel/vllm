# P TP 4 - D DPEP 4 test case for DSv4-Flash. The layouts must stay empty: the V4 indexer rejects the HND default.
- label: ":intel: (BMG) DSv4-Flash Disaggregated DP EP"
  key: dsv4-flash-disaggregated-intel
  timeout_in_minutes: 90
  num_devices: 8
  device: intel_gpu
  agent_tags:
    label: production
    gpu: 8+
    mem: 24+
  no_plugin: true
  optional: true
  working_dir: "."
  env:
    REGISTRY: "public.ecr.aws/q9t5s3a7"
    REPO: "vllm-ci-test-repo"
    VLLM_TEST_DEVICE: "xpu"
  source_file_dependencies:
    - vllm/distributed/kv_transfer/kv_connector/v1/nixl/
    - tests/v1/kv_connector/nixl_integration/
    - vllm/model_executor/layers/fused_moe/
    - vllm/model_executor/layers/quantization/
    - vllm/models/deepseek_v4/
    - vllm/v1/attention/
    - vllm/platforms/xpu.py
    - .buildkite/intel_jobs/disaggregated_intel.yaml
  commands:
    - >-
      bash .buildkite/scripts/hardware_ci/run-intel-test.sh
      'cd tests &&
      KV_BUFFER_DEVICE=xpu
      ENABLE_HMA_FLAG=1
      DP_EP=1
      GPU_MEMORY_UTILIZATION=0.85
      PREFILLER_TP_SIZE=4
      DECODER_TP_SIZE=4
      PREFILL_BLOCK_SIZE=256
      DECODE_BLOCK_SIZE=256
      MODEL_NAMES=deepseek-ai/DeepSeek-V4-Flash
      VLLM_ENGINE_READY_TIMEOUT_S=1800
      VLLM_SERVE_EXTRA_ARGS=--trust-remote-code,--kv-cache-dtype,fp8
      PREFILLER_KV_LAYOUT=
      DECODER_KV_LAYOUT=
      bash v1/kv_connector/nixl_integration/run_accuracy_test.sh'

